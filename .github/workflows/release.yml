name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            artifact: bitwark-linux-x86_64
          - target: aarch64-linux
            os: ubuntu-latest
            artifact: bitwark-linux-aarch64
          - target: x86_64-macos
            os: macos-13
            artifact: bitwark-macos-x86_64
          - target: aarch64-macos
            os: macos-latest
            artifact: bitwark-macos-aarch64
          - target: x86_64-windows
            os: windows-latest
            artifact: bitwark-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Archive artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp -r zig-out/bin staging/
          tar -czf ${{ matrix.artifact }}.tar.gz -C staging .
          echo "ASSET=${{ matrix.artifact }}.tar.gz" >> $GITHUB_ENV

      - name: Archive artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item -Recurse zig-out/bin/* staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact }}.zip
          "ASSET=${{ matrix.artifact }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ASSET }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*